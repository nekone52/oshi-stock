# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

# ---- 推しストック用に足したルール(#134) ----

# 1行は120文字まで(横にスクロールしなくても読めるように)
# マイグレーションは作ったときの記録なので、あとから書きかえない
Layout/LineLength:
  Enabled: true
  Max: 120
  Exclude:
    - "db/**/*"

# 「〜じゃなければ、すぐ帰る」の形で書いて、入れ子を浅くする
Style/GuardClause:
  Enabled: true

# has_many に dependent: をつけ忘れない(親を消したときに、子が迷子にならないように)
Rails/HasManyOrHasOneDependent:
  Enabled: true

# つながりの反対がわを Rails が見つけられるようにする
Rails/InverseOf:
  Enabled: true

# belongs_to は最初から「必須」なので、presence のチェックを二重に書かない
Rails/RedundantPresenceValidationOnBelongsTo:
  Enabled: true

# 使っていない変数・引数を見つける
Lint/UselessAssignment:
  Enabled: true
Lint/UnusedMethodArgument:
  Enabled: true

# Metrics(メソッドの長さ・仕事の重さ)は、処理の長さや複雑さを見直すきっかけの目安。
# #135 でスコープにまとめたあとの、いちばん重いものより少し上を上限にして、これ以上ふくらませない見張り役にする。
# (#135 のあと:いちばん長いのは goods#create の17行、いちばん重いのは goods#index の 36.9)
Metrics/MethodLength:
  Enabled: true
  Max: 20
  Exclude:
    - "db/**/*"
Metrics/AbcSize:
  Enabled: true
  Max: 40
  Exclude:
    - "db/**/*"

# ---- 入れないと決めたルール ----

# Rails/I18nLocaleTexts は入れない。
# 現時点では多言語対応の予定がなく、画面の文章は使用箇所で管理する方針のため。
